[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-vla-research"
version = "0.1.0"
description = "Research scaffold: unified decision-sufficient context for VLA"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "UC-VLA Research Contributors"}]
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.10,<1", "hypothesis>=6,<7"]
hdf5 = ["h5py>=3.10,<4", "numpy>=1.26,<3"]  # real-data importers only; core stays pure-Python

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
