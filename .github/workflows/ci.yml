name: CPU contract tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q          # real-data tests skip when datasets/ is absent
      - run: python scripts/generate_sodh.py && python scripts/audit_sodh.py
      - run: python scripts/generate_sodh2.py
      - run: python scripts/package_manifest.py --check
      - run: python scripts/repo_scan.py --strict
