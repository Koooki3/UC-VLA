name: CPU contract tests
on:
  push:
  pull_request:
jobs:
  core:
    name: lint + tests + freeze guards (core, hdf5, lerobot, CPU torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check src tests scripts
      - run: python scripts/generate_sodh.py && python scripts/audit_sodh.py
      - run: python scripts/generate_sodh2.py
      - run: python -m pytest -q          # includes freeze guards, v2 gates, resume equivalence, learned readers
      - run: python scripts/package_manifest.py --check
      - run: python scripts/repo_scan.py --strict
